[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marswalk"
version = "1.2.0"
description = "Suited-astronaut traverse planner for Mars EVAs (Gale / Mount Sharp boxwork baseline)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-image>=0.24",
  "matplotlib>=3.9",
  "pillow>=10",          # overlay PNG encoding
  "rasterio>=1.4",       # GDAL: PDS IMG, ISIS3 cubes, JP2, /vsicurl/ windowed reads, reprojection
  "pyproj>=3.6",         # Mars CRS transforms
  "numba>=0.61",         # compiled A* and edge-cost kernels
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",     # SQLite persistence behind the API (plans, observations)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
marswalk = "marswalk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
marswalk = ["eink_fonts/*.ttf", "eink_fonts/NOTICE.md", "sources/data/*.gz"]
